    label: Price / value for money
  - id: material
    label: Material safety (EVA, odor-free, eco-friendly)
  - id: waterproof
    label: Waterproof / anti-mold / quick-dry
  - id: magnet
    label: Magnet / weighted hem (stays against the tub)
  - id: transparency
    label: Transparency / light filtering
