- id: q_importance_title
  prompt: A complete, clear product TITLE (size, material, key feature) matters to me.
  type: likert
  construct: q_importance_title
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_image
  prompt: CLEAR MAIN IMAGES that show the real look & effect matter to me.
  type: likert
  construct: q_importance_image
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_bullets
  prompt: Selling-point BULLETS (5 bullets) that explain benefits matter to me.
  type: likert
  construct: q_importance_bullets
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_aplus
  prompt: A+ content / product video / brand story pages influence my decision.
  type: likert
  construct: q_importance_aplus
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_attr
  prompt: Complete ATTRIBUTES / size & spec tables (dimensions, material, weight) matter to me.
  type: likert
  construct: q_importance_attr
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_price
  prompt: PRICE and value for money matter to me.
  type: likert
  construct: q_importance_price
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_reviews
  prompt: RATINGS + review count + review content influence my decision.
  type: likert
  construct: q_importance_reviews
  required: true
  minValue: 1
  maxValue: 5
- id: q_importance_trust
  prompt: Brand trust and safety certifications (BPA-free / PVC-free / odor-free) matter to me.
  type: likert
  construct: q_importance_trust
  required: true
  minValue: 1
  maxValue: 5
- id: q_listing_redline
  prompt: Which of the following would make you EXCLUDE a shower curtain liner immediately? Select all that apply.
  type: multi_choice
  construct: listing_redline
  required: true
  options:
  - id: no_price
    label: No price shown
  - id: low_rating
    label: Rating below 4.0
  - id: few_reviews
    label: Fewer than ~50 reviews
  - id: no_size
    label: No size / dimensions information
  - id: material_unclear
    label: Material not clearly stated
  - id: blur_image
    label: Main image is blurry / looks fake
  - id: no_bullets
    label: No selling-point bullets / thin description
  - id: no_aplus
    label: No A+ content / video / rich media
  - id: brand_unfamiliar
    label: Brand is completely unfamiliar
  - id: none
    label: None of the above would make me exclude a product
- id: q_material_pref
  prompt: Which liner material do you prefer?
  type: single_choice
  construct: material_pref
  required: true
  options:
  - id: eva
    label: EVA (flexible, odor-free, lightweight)
  - id: peva
    label: PEVA (chlorine-free alternative)
  - id: pvc
    label: PVC (heavier, classic)
  - id: polyester
    label: Polyester / fabric (machine-washable)
  - id: cloth
    label: Cloth / cotton blend
  - id: no_preference
    label: No strong preference
- id: q_transparency_pref
  prompt: Which transparency level do you prefer for a liner?
  type: single_choice
  construct: transparency_pref
  required: true
  options:
  - id: fully_transparent
    label: Fully transparent (lets light through)
  - id: semi
    label: Semi-transparent / light-filtering
  - id: blackout
    label: Opaque / blackout
  - id: no_preference
    label: No strong preference
- id: q_badge_effect
  prompt: If one liner on the shelf carried an "Amazon's Choice" or "Best Seller" badge, would it influence you?
  type: single_choice
  construct: badge_effect
  required: true
  options:
  - id: yes_strongly
    label: Yes, a lot
  - id: yes_somewhat
    label: Yes, somewhat
  - id: neutral
    label: Neutral
  - id: unlikely
    label: Probably not
  - id: no_effect
    label: No, it wouldn't affect me
- id: q_switch_trigger
  prompt: What would most likely make you switch to a different option on this shelf?
  type: single_choice
  construct: switch_trigger
  required: true
  options:
  - id: lower_price
    label: A lower price
  - id: better_rating
    label: A higher rating / more reviews
  - id: better_look
    label: Better looks / design
  - id: better_function
    label: Better function / features (magnets, waterproof, quick-dry)
  - id: better_value
    label: Better value (2-pack, hooks included)
  - id: nothing
    label: Nothing — I'm confident in my choice
- id: q_price_acceptance
  prompt: The price of the liner I chose is acceptable for what it offers.
  type: likert
  construct: price_acceptance
  required: true
  minValue: 1
  maxValue: 5
- id: q_purchase_intent
  prompt: I would realistically buy this shower curtain liner within the next 3 months.
  type: likert
  construct: purchase_intent
  required: true
  minValue: 1
  maxValue: 5
