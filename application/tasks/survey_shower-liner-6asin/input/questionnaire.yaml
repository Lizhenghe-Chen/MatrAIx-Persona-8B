- id: q_page_browse
  prompt: On Amazon, how far into the search results would you still click in and BROWSE a shower curtain liner?
  type: single_choice
  construct: page_browse
  required: true
  options:
  - id: page1
    label: Page 1 only
  - id: page2
    label: I would go to page 2
  - id: page3
    label: I would go to page 3
  - id: page4_5
    label: I would go to pages 4–5
  - id: beyond
    label: I might even go past page 5
  - id: unsure
    label: Not sure
- id: q_page_buy
  prompt: On Amazon, how far into the search results would you still consider BUYING a shower curtain liner?
  type: single_choice
  construct: page_buy
  required: true
