schemaVersion: '1.0'
id: shower_liner_6asin_v1
title: Shower Curtain Liner Shopping Choice Survey (6 ASINs + None)
description: Which shower curtain liner the persona would actually buy from a 6-option shelf (plus 'none'), why the other
  5 were rejected, search-page browse/buy tolerance, and how listing-optimization elements (title/images/bullets/A+/attributes/price/reviews/brand
  trust) shape the decision; stock/availability is held constant and excluded as a factor.
questions:
- id: q_choice
  prompt: Which shower curtain liner would you buy for your bathroom? Give a 2-3 sentence reason for your choice.
  type: single_choice
  construct: liner_choice
  required: true
  askRationale: true
  options:
  - id: A
    label: A — AmazerBath AmazerBath Rainbow Emerald EVA Shower Curtain Liner (72" x 72") ($18.99)
  - id: B
    label: B — jssablo jssablo Blue Cube 3D EVA Shower Curtain Liner, 72" x 72", Magnetic ($7.19)
  - id: C
    label: C — LQFMEHOT LQFMEHOT EVA Blue Water-Wave Shower Curtain Liner, 72" x 72", Art Deco ($7.09)
  - id: D
    label: D — Laumyasof Laumyasof 2-Pack Green 3D Pebble EVA Shower Curtain Liner, 72" x 72" ($9.99)
  - id: E
    label: E — Dependable Industries Essentials Dependable Industries EVA Black Shower Curtain Liner, 72" x 72", Modern ($9.99)
  - id: F
    label: F — MuuXii MuuXii EVA Clear Polka-Dot Shower Curtain Liner, 71" x 71", with Hooks (Not shown on listing)
  - id: none_of_these
    label: None of these — I would not buy any of them
- id: q_reject_A
  prompt: Why did you NOT choose Option A (AmazerBath, $18.99)? Select ALL that apply. If this is the one you chose, select
    'This is the one I chose'.
  type: multi_choice
  construct: reject_A
  required: true
  options:
  - id: already_chosen
    label: This is the one I chose
  - id: price_too_high
    label: Price is too high for a liner
  - id: price_suspicious
    label: Price seems cheap — I worry about quality
  - id: look
    label: I don't like the look / color / texture
  - id: material
    label: Material (EVA etc.) is not convincing / I worry about safety
  - id: rating
    label: Rating is not high enough
  - id: few_reviews
    label: Too few reviews — not enough evidence
  - id: review_concern
    label: Review comments raised doubts
  - id: brand
    label: Brand is unfamiliar / not trustworthy enough
  - id: size
    label: Size / fit is unclear or unusual (71x71, 72x72)
  - id: missing_magnet
    label: Missing magnet / weighted hem I want
  - id: transparency
    label: Transparency or light-blocking is not what I want
  - id: pack
    label: Pack size is not what I want (single vs 2-pack)
  - id: info_incomplete
    label: Product info is incomplete (description / images / specs)
  - id: other
    label: Other reason
