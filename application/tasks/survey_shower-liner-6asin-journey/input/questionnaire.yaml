- id: q_buy_first
  prompt: After inspecting this first product page, what do you do?
  type: single_choice
  construct: buy_first
  required: true
  options:
  - id: buy_now
    label: Buy it now — I would place the order on this product
  - id: add_cart
    label: Add it to cart, but keep comparing the others
  - id: not_buy
    label: Not buy it — go back to the search results
- id: q_notbuy_first
  prompt: If you would NOT order this first product, what concerns or reasons hold you back? Select all that apply. If you
    would buy it, select 'I have no real concern'.
  type: multi_choice
  construct: notbuy_first
  required: true
  options:
  - id: no_concern
    label: I have no real concern — I would buy this one
  - id: price_too_high
    label: Price is too high for a liner
  - id: price_suspicious
    label: Price seems too cheap — I worry about quality / smell
  - id: look
    label: I don't like the look / color / pattern
  - id: material
    label: Material is not convincing / I worry about safety or plastic smell
  - id: rating
    label: Star rating is not high enough
  - id: few_reviews
    label: Too few reviews — not enough evidence
  - id: review_concern
    label: Review comments / photos raised doubts (mold, tearing, etc.)
  - id: brand
    label: Brand is unfamiliar / not trustworthy enough
  - id: size
    label: Size / fit is unclear or unusual (71x71 vs 72x72)
  - id: missing_magnet
    label: Missing magnets / weighted hem I want
  - id: transparency
    label: Transparency / light-blocking is wrong for my bathroom
  - id: pack
    label: Pack size is wrong (I want single / 2-pack)
  - id: info_incomplete
    label: Product page info is incomplete (images / bullets / specs)
  - id: want_compare
    label: Nothing wrong — I just want to compare other options first
  - id: other
    label: Other concern (explain in your reason)
