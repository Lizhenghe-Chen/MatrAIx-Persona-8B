schemaVersion: '1.0'
id: shower_liner_6asin_journey_v1
title: Amazon Shower Curtain Liner Click-Journey Survey (6 results)
description: 'Simulates the Amazon search-to-purchase journey across 6 shower curtain liner results: first click + drivers
  on the search page, product-page information inspection, buy/not-buy decisions and concerns at the 1st/2nd/3rd click, fallback
  favorite after clicking through all, per-product final attitude, search-page tolerance, decision factors, and listing-optimization
  importance/red-lines. Stock, availability, delivery and buy-box state are held identical and excluded as factors; one missing
  source price is filled with a controlled assumed price.'
questions:
- id: q_first_click
  prompt: 'STAGE 1 — Search results page: which of the 6 product cards would you click into FIRST? Give a 1-2 sentence reason
    (what on the card made you click).'
  type: single_choice
  construct: first_click
  required: true
  options:
  - id: A
    label: A — AmazerBath AmazerBath Rainbow Emerald EVA Shower Curtain Liner (72" x 72") ($18.99)
  - id: B
    label: B — jssablo jssablo Blue Cube 3D EVA Shower Curtain Liner, 72" x 72", Magnetic ($7.19)
  - id: C
    label: C — LQFMEHOT LQFMEHOT EVA Blue Water-Wave Shower Curtain Liner, 72" x 72", Art Deco ($7.09)
  - id: D
    label: D — Laumyasof Laumyasof 2-Pack Green 3D Pebble EVA Shower Curtain Liner, 72" x 72" ($9.99)
  - id: E
    label: E — Dependable Industries Essentials Dependable Industries EVA Black Shower Curtain Liner, 72" x 72", Modern ($9.99)
  - id: F
    label: F — MuuXii MuuXii EVA Clear Polka-Dot Shower Curtain Liner, 71" x 71", with Hooks ($7.99)
  - id: none_of_these
    label: None of these cards — I would not click any of them
  askRationale: true
- id: q_click_drivers
  prompt: On the search-result card, what specifically made you want to click it first? Select all that apply.
  type: multi_choice
  construct: click_drivers
  required: true
  options:
  - id: main_image
    label: The main image / lifestyle photo caught my eye
  - id: color_pattern
    label: Its color / pattern / 3D texture stood out
  - id: price
    label: The price looked attractive on the card
  - id: star_rating
    label: Its star rating looked high
  - id: review_count
    label: It had a lot of reviews (social proof)
  - id: title_keyword
    label: The title named a feature I want (magnetic, odor-free, etc.)
  - id: brand
    label: I recognized / trusted the brand name
  - id: pack_value
    label: Multi-pack or hooks-included value on the card
  - id: magnets
    label: Magnets / weighted hem selling point
  - id: material_word
    label: Material wording (EVA, BPA-free, PVC-free, odor-free)
  - id: right_size
    label: Size (72x72 etc.) clearly fits my bathroom
  - id: imagine_look
    label: I could picture it looking good in my bathroom
  - id: other
    label: Something else (explain in your reason)
- id: q_detail_info
