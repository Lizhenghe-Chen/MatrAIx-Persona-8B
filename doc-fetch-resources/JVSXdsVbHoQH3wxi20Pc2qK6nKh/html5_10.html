<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="三种打开方式">
<title></title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FFFFFF; color:#1A2B4A; width:100%; }
  .card { border:1px solid #DDE0E4; border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .h { font-size:14px; font-weight:700; margin-bottom:10px; color:#1A2B4A; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
  @media (max-width:600px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { background:#F4F6FA; border-radius:10px; padding:12px 8px; text-align:center; }
  .kpi .v { font-size:20px; font-weight:800; color:#1A2B4A; font-family:ui-monospace,monospace; }
  .kpi .k { font-size:11px; color:#758092; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { background:#EEF1F6; text-align:left; padding:7px 9px; color:#1A2B4A; }
  td { padding:7px 9px; border-bottom:1px solid #DDE0E4; vertical-align:top; color:#334155; }
  .bar-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12.5px; }
  .bar-label { width:150px; flex:none; text-align:right; color:#758092; }
  .bar-track { flex:1; background:#EEF1F6; border-radius:4px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:#1A2B4A; border-radius:4px; }
  .bar-val { width:70px; flex:none; font-weight:700; color:#1A2B4A; }
  .note { font-size:11.5px; color:#758092; margin-top:6px; }
  ul { padding-left:18px; font-size:13px; color:#334155; }
  li { margin:5px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="h">① 解码读取（官方推荐 pyarrow）→ ② 索引筛选 → ③ 采样实例化 LLM</div>
  <table>
    <tr><th>方式</th><th>做法</th><th>适用</th></tr>
    <tr><td>解码读取</td><td>pyarrow + persona_codes.schema.json 解码 attributes/null_bitmap</td><td>全量分析、抽样构建</td></tr>
    <tr><td>索引筛选</td><td>SQLite postings 按「维度=取值」取全局行号</td><td>免扫 4GB 的条件筛选</td></tr>
    <tr><td>采样运行</td><td>按校准目标分层采样 → YAML 人格 → 实例化为 LLM 智能体跑任务</td><td>用户研究 / 产品评估（本 demo 用法）</td></tr>
  </table>
  <div class="note">本仓库保温杯 demo：采样 1,000 人格跑问卷，成本约 ¥4.5、34 分钟（20 并发），分群画像全部来自人格属性。</div>
</div>
</body>
</html>
