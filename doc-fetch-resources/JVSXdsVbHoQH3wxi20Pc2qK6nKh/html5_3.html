<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="来源构成：6 真实来源 + 1 合成，599,847 真实衍生 + 400,000 合成">
<title></title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FFFFFF; color:#1A2B4A; width:100%; }
  .card { border:1px solid #DDE0E4; border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .h { font-size:14px; font-weight:700; margin-bottom:10px; color:#1A2B4A; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
  @media (max-width:600px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { background:#F4F6FA; border-radius:10px; padding:12px 8px; text-align:center; }
  .kpi .v { font-size:20px; font-weight:800; color:#1A2B4A; font-family:ui-monospace,monospace; }
  .kpi .k { font-size:11px; color:#758092; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { background:#EEF1F6; text-align:left; padding:7px 9px; color:#1A2B4A; }
  td { padding:7px 9px; border-bottom:1px solid #DDE0E4; vertical-align:top; color:#334155; }
  .bar-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12.5px; }
  .bar-label { width:150px; flex:none; text-align:right; color:#758092; }
  .bar-track { flex:1; background:#EEF1F6; border-radius:4px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:#1A2B4A; border-radius:4px; }
  .bar-val { width:70px; flex:none; font-weight:700; color:#1A2B4A; }
  .note { font-size:11.5px; color:#758092; margin-top:6px; }
  ul { padding-left:18px; font-size:13px; color:#334155; }
  li { margin:5px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="h">各来源人格数量（合计 999,847）</div>
  <div class="bar-row"><div class="bar-label">synthetic 合成</div><div class="bar-track"><div class="bar-fill" style="width:100.0%"></div></div><div class="bar-val">400,000</div></div><div class="bar-row"><div class="bar-label">wiki 维基百科</div><div class="bar-track"><div class="bar-fill" style="width:80.9%"></div></div><div class="bar-val">323,438</div></div><div class="bar-row"><div class="bar-label">stackoverflow 开发者问卷</div><div class="bar-track"><div class="bar-fill" style="width:28.3%"></div></div><div class="bar-val">113,120</div></div><div class="bar-row"><div class="bar-label">amazon 商品评论</div><div class="bar-track"><div class="bar-fill" style="width:24.5%"></div></div><div class="bar-val">97,915</div></div><div class="bar-row"><div class="bar-label">gss 社会调查</div><div class="bar-track"><div class="bar-fill" style="width:15.9%"></div></div><div class="bar-val">63,532</div></div><div class="bar-row"><div class="bar-label">prism 对齐数据</div><div class="bar-track"><div class="bar-fill" style="width:0.4%"></div></div><div class="bar-val">1,487</div></div><div class="bar-row"><div class="bar-label">real_human_survey 真人问卷</div><div class="bar-track"><div class="bar-fill" style="width:0.1%"></div></div><div class="bar-val">355</div></div>
  <div class="note">填充度差异是有意设计：合成人格 990/990 齐全；一条 Amazon 评论仅支撑约 16 个属性。缺失 = 来源不支持，不做插补。</div>
</div>
</body>
</html>
