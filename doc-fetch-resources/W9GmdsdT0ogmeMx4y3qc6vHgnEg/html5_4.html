<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="维度体系：1,290 维度归并为 9 大族">
<title></title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FFFFFF; color:#1A2B4A; width:100%; }
  .card { border:1px solid #DDE0E4; border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .h { font-size:14px; font-weight:700; margin-bottom:10px; color:#1A2B4A; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
  @media (max-width:600px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { background:#F4F6FA; border-radius:10px; padding:12px 8px; text-align:center; }
  .kpi .v { font-size:20px; font-weight:800; color:#1A2B4A; font-family:ui-monospace,monospace; }
  .kpi .k { font-size:11px; color:#758092; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { background:#EEF1F6; text-align:left; padding:7px 9px; color:#1A2B4A; }
  td { padding:7px 9px; border-bottom:1px solid #DDE0E4; vertical-align:top; color:#334155; }
  .bar-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12.5px; }
  .bar-label { width:150px; flex:none; text-align:right; color:#758092; }
  .bar-track { flex:1; background:#EEF1F6; border-radius:4px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:#1A2B4A; border-radius:4px; }
  .bar-val { width:70px; flex:none; font-weight:700; color:#1A2B4A; }
  .note { font-size:11.5px; color:#758092; margin-top:6px; }
  ul { padding-left:18px; font-size:13px; color:#334155; }
  li { margin:5px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="h">9 大族维度数（合计 1,290，43 个子类）</div>
  <div class="bar-row"><div class="bar-label">兴趣与媒介</div><div class="bar-track"><div class="bar-fill" style="width:100.0%"></div></div><div class="bar-val">358</div></div><div class="bar-row"><div class="bar-label">专业与技能</div><div class="bar-track"><div class="bar-fill" style="width:99.4%"></div></div><div class="bar-val">356</div></div><div class="bar-row"><div class="bar-label">人格与心理</div><div class="bar-track"><div class="bar-fill" style="width:60.1%"></div></div><div class="bar-val">215</div></div><div class="bar-row"><div class="bar-label">语言与沟通</div><div class="bar-track"><div class="bar-fill" style="width:25.1%"></div></div><div class="bar-val">90</div></div><div class="bar-row"><div class="bar-label">行为与习惯</div><div class="bar-track"><div class="bar-fill" style="width:19.3%"></div></div><div class="bar-val">69</div></div><div class="bar-row"><div class="bar-label">开发者专项</div><div class="bar-track"><div class="bar-fill" style="width:18.4%"></div></div><div class="bar-val">66</div></div><div class="bar-row"><div class="bar-label">职业与行业</div><div class="bar-track"><div class="bar-fill" style="width:15.4%"></div></div><div class="bar-val">55</div></div><div class="bar-row"><div class="bar-label">人口与背景</div><div class="bar-track"><div class="bar-fill" style="width:14.5%"></div></div><div class="bar-val">52</div></div><div class="bar-row"><div class="bar-label">健康</div><div class="bar-track"><div class="bar-fill" style="width:8.1%"></div></div><div class="bar-val">29</div></div>
  <div class="note">覆盖「背景 → 心理 → 能力 → 行为」整个人类画像；含 66 个 AI 时代开发者专项维度（智能体采用、AI 工作流等）。</div>
</div>
</body>
</html>
